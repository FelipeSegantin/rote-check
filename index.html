<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)" />
    <title>RoteCheck</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // Aplica um tema logo de cara (antes do React montar), pra não
      // piscar escuro e depois trocar pra claro quando o SO já está em
      // modo claro. O App.jsx troca isso de novo assim que sabe a
      // preferência salva no perfil da pessoa (que pode ser diferente do
      // sistema — esse script aqui é só o "chute inicial").
      try {
        var claro = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = claro ? "claro" : "escuro";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
